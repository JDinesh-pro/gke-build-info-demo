apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-info-api
  labels:
    app: build-info-api

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
      
  selector:
    matchLabels:
      app: build-info-api

  template:
    metadata:
      labels:
        app: build-info-api

    spec:
      containers:
        - name: build-info-api

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: "1.0.0"

            - name: ENVIRONMENT
              value: "demo"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"